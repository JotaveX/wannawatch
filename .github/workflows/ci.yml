# Testes do back e do front a cada push/PR. Na main, se os testes passarem: o front vai para a Cloudflare
# (wrangler) e a imagem da API vai para o GHCR, seguida do deploy na VPS (README, seção "Deploy").
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Os testes de integração sobem o postgres:18-alpine pelo Testcontainers (o runner já tem Docker).
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 3

  site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
      # frontend/wrangler.jsonc: arquivos estáticos + domínio wannawatch.jotave.dev.
      - working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.169.0 deploy

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A VPS é x86 (Hostinger).
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/jotavex/wannawatch-api:latest
            ghcr.io/jotavex/wannawatch-api:${{ github.sha }}
          cache-from: type=gha,scope=wannawatch-api
          cache-to: type=gha,mode=max,scope=wannawatch-api

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      packages: read
    steps:
      - name: atualiza a VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # A chave só pode rodar /opt/wannawatch/deploy.sh (command= no authorized_keys da VPS); o token do job
          # (leitura do GHCR, expira com o job) vai pela entrada padrão para o pull da imagem.
          # A rede entre o runner e a Hostinger às vezes não conecta (timeout antes de chegar no sshd): tenta de
          # novo, o deploy.sh pode rodar mais de uma vez sem problema.
          for try in 1 2 3 4 5; do
            printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 "$TARGET" && exit 0
            echo "::warning::tentativa $try falhou, de novo em 30 s"
            sleep 30
          done
          exit 1

# Produção na VPS (Hostinger, 2 vCPU / 8 GB, dividida com o zaptank): Postgres + API + Cloudflare Tunnel.
# Nenhuma porta aberta para a internet: o tunnel faz conexão de saída e publica
# https://apiwannawatch.jotave.dev → api:8081. O front fica na Cloudflare (Workers estáticos) e as fotos no R2.
#
# Na VPS este arquivo fica em /opt/wannawatch/compose.yml, com os segredos em /opt/wannawatch/.env
# (chmod 600, fora do git; modelo em deploy/.env.example). Passo a passo no README, seção "Deploy".
#
#   docker compose up -d       sobe tudo (a imagem vem do GHCR, montada pelo GitHub Actions)
name: wannawatch

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wannawatch
      POSTGRES_USER: wannawatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    # Pequeno de propósito: a máquina é dividida com o zaptank.
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=8MB
      -c maintenance_work_mem=64MB -c max_connections=30
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wannawatch -d wannawatch"]
      interval: 10s
      timeout: 5s
      retries: 10

  # As migrações (Flyway) rodam na subida da API.
  api:
    <<: *restart
    image: ghcr.io/jotavex/wannawatch-api:${TAG:-latest}
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 1500m
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: wannawatch
      DB_USER: wannawatch
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://wannawatch.jotave.dev
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:?defina TMDB_API_TOKEN}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # O e-mail sai pelo Resend: sem isto o /actuator/health fica DOWN testando um SMTP que não existe.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MAIL_FROM: ${MAIL_FROM:-wannawatch? <nao-responda@jotave.dev>}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-wannawatch}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://r2wannawatch.jotave.dev}

  tunnel:
    <<: *restart
    image: cloudflare/cloudflared:2026.10.5
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Cloudflare Zero Trust → Networks → Tunnels → wannawatch-vps.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?defina TUNNEL_TOKEN}
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:

spring:
  application:
    name: wannawatch
  # Lê o .env da raiz do monorepo (o mesmo que o docker-compose usa).
  # Funciona rodando de dentro de backend/ ou da raiz. Variáveis de ambiente reais têm prioridade.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:wannawatch}
    username: ${DB_USER:wannawatch}
    password: ${DB_PASSWORD:wannawatch}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  # E-mail (código de confirmação do cadastro). Em desenvolvimento é o Mailpit do docker-compose:
  # tudo que sai fica em http://localhost:8025, nada chega a uma caixa de verdade.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 20s

server:
  port: ${BACKEND_PORT:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---------------------------------------------------------------------------
# TMDB e importação
# ---------------------------------------------------------------------------
wannawatch:
  mail:
    from: ${MAIL_FROM:wannawatch? <nao-responda@wannawatch.local>}
    # Preenchida, o código vai pela API do Resend em vez do SMTP acima.
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: https://api.resend.com
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  images:
    base-url: https://image.tmdb.org/t/p
  search:
    similarity-threshold: 0.6   # 0 a 1; maior = menos resultados parecidos
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-token: ${TMDB_API_TOKEN:}
    language: pt-BR
    region: BR            # classificação indicativa e "onde assistir"
    requests-per-second: 20
    max-concurrency: 6
    max-retries: 3
  # Vídeos curtos do Reels (fase de teste): só busca e metadados, o vídeo toca pelo embed.
  youtube:
    base-url: https://www.googleapis.com/youtube/v3
    api-key: ${YOUTUBE_API_KEY:}
    region-code: BR
    relevance-language: pt
    results-per-search: 15   # a busca custa o mesmo com 1 ou 50; só os verticais ficam
  import:
    on-startup-if-empty: true
    cron: "0 0 4 * * *"   # todo dia às 4h; "-" desliga
    zone: America/Sao_Paulo
    admin-token: ${ADMIN_TOKEN:}
    lists:
      - { key: trending_day,   path: /trending/all/day, pages: 2 }
      - { key: popular_movie,  path: /movie/popular,    media-type: MOVIE,  pages: 5 }
      - { key: popular_series, path: /tv/popular,       media-type: SERIES, pages: 5 }
      - { key: top_movie,      path: /movie/top_rated,  media-type: MOVIE,  pages: 5 }
      - { key: top_series,     path: /tv/top_rated,     media-type: SERIES, pages: 5 }
    # A TMDB não traduz estes gêneros de série para pt-BR.
    genre-names:
      "10759": Ação e aventura
      "10762": Infantil
      "10763": Notícias
      "10764": Reality show
      "10765": Ficção científica e fantasia
      "10766": Novela
      "10767": Talk show
      "10768": Guerra e política

# ---------------------------------------------------------------------------
# Recomendação (baseada em conteúdo; pesos são pontos de partida)
# ---------------------------------------------------------------------------
  recommendation:
    # peso de cada família no vetor do título (cada família é normalizada antes)
    features:
      genre: 3.0
      keyword: 2.0
      direction: 2.0          # Director / Creator
      writing: 1.0            # Writer / Screenplay / Story / Novel
      cast: 1.0
      other-crew: 0.3         # Composer / Director of Photography
      language: 0.5
      decade: 0.3
      type: 0.3
      genre-position-decay: 0.5   # gênero na posição p vale 1 / (1 + 0.5·p)
      cast-top-billing: 5         # credit_order < 5 = protagonista
      cast-top-weight: 1.0
      cast-rest-weight: 0.5
      min-document-frequency: 2   # pessoa/keyword em menos títulos que isso é descartada
    # peso de cada interação no perfil (negativos vão para o perfil negativo)
    signals:
      favorite-title: 1.5     # sem decaimento
      like: 1.0
      saved: 0.8
      match-yes: 0.6
      maybe: 0.3
      seen: 0.0               # só tira dos feeds
      pass: -0.4
      match-no: -0.5
      favorite-genre: 1.0
      half-life-days: 90
    scoring:
      affinity: 0.70
      popularity: 0.15
      quality: 0.15
      negative-factor: 0.5    # affinity = cos(positivo) − 0.5·cos(negativo)
      cold-start-signals: 5   # com menos sinais positivos, puxa para popularidade
      cold-popularity: 0.5
      cold-quality: 0.3
      cold-favorite-genre: 0.2
    tmdb-recommendation-bonus: 0.1
    quality-prior-votes: 200  # "m" da média bayesiana
    reason-similarity: 0.35   # mínimo para "Porque você curtiu X"
    diversity:
      window: 10
      max-per-genre: 3
    maybe-cooldown: 7d
    cache-ttl: 10m
    feed:
      swipe-noise: 0.15             # ordem do Swipe = score + 0.15·ruído(seed, id)
      exploration-every: 5          # 1 carta de exploração a cada 5 (0 desliga)
      exploration-genre-share: 0.25 # "pouco peso" = até 25% do gênero mais forte
      snapshot-ttl: 30m             # ordem guardada por visita, para a paginação
      reels-score: 0.6              # ordem do Reels = 0.6·score + 0.4·popularidade
      reels-popularity: 0.4
      reels-video-boost: 0.15       # + 0.15 para quem tem vídeo aprovado (também sem login)
    # deck do Match: média dos percentis − λ·desvio, sem miséria
    group:
      lambda: 0.5
      misery-threshold: 0.25        # alguém abaixo disso → fim do deck
      like-bonus: 0.15              # por participante que quer ver
      seen-penalty: 0.20            # por participante que já viu
      noise: 0.05
      good-for-all: 0.6             # "Bom pra você e pra Bia"
      shared-genre-share: 0.5       # "Todo mundo curte X"

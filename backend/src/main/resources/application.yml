spring:
  application:
    name: wannawatch
  # Lê o .env da raiz do monorepo (o mesmo que o docker-compose usa).
  # Funciona rodando de dentro de backend/ ou da raiz. Variáveis de ambiente reais têm prioridade.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:wannawatch}
    username: ${DB_USER:wannawatch}
    password: ${DB_PASSWORD:wannawatch}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 20s

server:
  port: ${BACKEND_PORT:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---------------------------------------------------------------------------
# TMDB e importação
# ---------------------------------------------------------------------------
wannawatch:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  images:
    base-url: https://image.tmdb.org/t/p
  search:
    similarity-threshold: 0.6   # 0 a 1; maior = menos resultados parecidos
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-token: ${TMDB_API_TOKEN:}
    language: pt-BR
    region: BR            # classificação indicativa e "onde assistir"
    requests-per-second: 20
    max-concurrency: 6
    max-retries: 3
  import:
    on-startup-if-empty: true
    cron: "0 0 4 * * *"   # todo dia às 4h; "-" desliga
    zone: America/Sao_Paulo
    admin-token: ${ADMIN_TOKEN:}
    lists:
      - { key: trending_day,   path: /trending/all/day, pages: 2 }
      - { key: popular_movie,  path: /movie/popular,    media-type: MOVIE,  pages: 5 }
      - { key: popular_series, path: /tv/popular,       media-type: SERIES, pages: 5 }
      - { key: top_movie,      path: /movie/top_rated,  media-type: MOVIE,  pages: 5 }
      - { key: top_series,     path: /tv/top_rated,     media-type: SERIES, pages: 5 }
    # A TMDB não traduz estes gêneros de série para pt-BR.
    genre-names:
      "10759": Ação e aventura
      "10762": Infantil
      "10763": Notícias
      "10764": Reality show
      "10765": Ficção científica e fantasia
      "10766": Novela
      "10767": Talk show
      "10768": Guerra e política

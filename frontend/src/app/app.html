<a class="skip-link" href="#conteudo" (click)="skipToContent($event)">Pular para o conteúdo</a>

<div class="shell" [class.shell--feed]="feed()" [class.shell--bare]="bare()">

  }

  @if (!bare()) {
    <ww-tab-bar class="tabs" />
  }
</div>
